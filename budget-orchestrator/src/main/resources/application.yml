spring:
  application:
    name: budget-orchestrator
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27018/orcamento}

management:
  endpoints:
    web:
      exposure:
        include: health,info

aws:
  region: ${AWS_REGION:us-east-1}
  endpoint: ${AWS_ENDPOINT:http://localhost:4566}
  access-key: ${AWS_ACCESS_KEY_ID:test}
  secret-key: ${AWS_SECRET_ACCESS_KEY:test}
  sqs:
    consumer:
      enabled: ${SQS_CONSUMER_ENABLED:true}
    budget-requests-queue: ${BUDGET_REQUESTS_QUEUE:budget-requests}
    budget-requests-dlq: ${BUDGET_REQUESTS_DLQ:budget-requests-dlq}
    budget-calculation-requests-queue: ${BUDGET_CALCULATION_REQUESTS_QUEUE:budget-calculation-requests}
    budget-calculation-requests-dlq: ${BUDGET_CALCULATION_REQUESTS_DLQ:budget-calculation-requests-dlq}
    max-messages: ${SQS_MAX_MESSAGES:10}
    wait-time-seconds: ${SQS_WAIT_TIME_SECONDS:5}
    polling-delay-ms: ${SQS_POLLING_DELAY_MS:3000}
