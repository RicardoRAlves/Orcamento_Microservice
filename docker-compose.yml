services:
  mongodb:
    image: ${MONGODB_IMAGE:-mongo:7}
    container_name: ${MONGODB_CONTAINER_NAME:-orcamento-mongodb}
    ports:
      - "${MONGODB_PORT:-27018}:27017"
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_INITDB_DATABASE:-orcamento}
    volumes:
      - mongodb-data:/data/db

  localstack:
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:3}
    container_name: ${LOCALSTACK_CONTAINER_NAME:-orcamento-localstack}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      - SERVICES=${LOCALSTACK_SERVICES:-sqs,lambda,iam,logs}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION:-us-east-1}
      - DEBUG=${LOCALSTACK_DEBUG:-0}
    volumes:
      - "${LOCALSTACK_INIT_PATH:-./localstack/init}:/etc/localstack/init/ready.d"
      - "${DOCKER_SOCKET_PATH:-/var/run/docker.sock}:/var/run/docker.sock"

volumes:
  mongodb-data:
    name: ${MONGODB_VOLUME_NAME:-mongodb-data}
